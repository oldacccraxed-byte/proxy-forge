
name: Build Proxy Forge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Extract project
        run: unzip ProxyForge2-AndroidStudio.zip -d source

      - name: Fix Java version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
              1
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: cd source && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-forge-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          
